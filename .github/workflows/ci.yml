name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      OWCOPILOT_ALLOW_OFFLINE_LLM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install API, model adapters and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[serve,dev,live]"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Test workflow and narrative contracts
        run: |
          python -m pytest -q \
            tests/domain/test_workflow_*.py \
            tests/domain/test_mechanic_ir_v2.py \
            tests/domain/test_logic_stepper.py \
            tests/domain/test_project_*.py \
            tests/domain/test_generated_*.py \
            tests/domain/test_creator_copy_contracts.py \
            tests/domain/test_narrative_localization_v2.py \
            tests/domain/test_player_presentation.py \
            tests/domain/test_reflection_normalization_v2.py \
            tests/domain/test_requirement_planning_admission_v2.py \
            tests/platform/test_workflow_*.py \
            tests/platform/test_creator_*.py \
            tests/platform/test_edit_continuity.py \
            tests/platform/test_intent_decision_origin.py \
            tests/platform/test_method_learning_jobs.py \
            tests/platform/test_task_method_permissions.py \
            tests/platform/test_published_patch_admission.py \
            tests/platform/test_connection_credentials.py \
            tests/agent/test_deepseek_thinking_tools_v2.py \
            tests/agent/test_execution_policy.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix apps/web
      - name: Test interaction contracts
        run: npm test --prefix apps/web
      - name: Type-check and build
        run: npm run build --prefix apps/web
