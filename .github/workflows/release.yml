# Release pipeline: tag vX.Y.Z -> run the full gate suite -> build and validate sdist+wheel ->
# publish to PyPI (Trusted Publishing / OIDC) -> create the GitHub Release with artifacts attached.
#
# One-time setup on PyPI: project Settings -> Publishing -> add this repo as a
# Trusted Publisher (no long-lived token needed). A missing or invalid publisher configuration is
# a release failure: it must not produce a GitHub Release for artifacts that never reached PyPI.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        # 'app' is not a real extra in pyproject.toml (no [project.optional-dependencies].app);
        # the release gate needs the same "deployable API + dev tooling" combo CI uses, plus redis.
        run: pip install -e ".[serve,dev,redis,postgres,tokenizer,mcp,pdf]"
      - name: Provision the pinned tokenizer
        run: python scripts/prefetch_models.py --component tokenizer
      - name: Lint
        # Keep the release lint boundary identical to CI. The repository has not adopted a
        # whole-tree Ruff-format baseline, so adding a release-only formatter gate would make every
        # otherwise valid tag fail on unrelated historical formatting.
        run: ruff check src tests scripts
      - name: Type-check
        run: mypy src/owcopilot
      - name: Tests (offline, $0)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python scripts/prefetch_models.py --component tokenizer --offline
          pytest -q
      - name: Acceptance benchmark
        run: python -m owcopilot.cli.main eval-acceptance --workspace .tmp/acc
      - name: Published Markdown and deterministic formal controls
        run: |
          python scripts/check_markdown_links.py
          python scripts/verify_formal_eval_artifacts.py
          python scripts/run_formal_evals.py \
            --output-dir .tmp/formal-evals-release \
            --run-id release-formal-v1 \
            --generated-at 2026-08-03T00:00:00Z
      - name: Frontend controls, build, budget, and browser smoke
        run: |
          npm ci --prefix apps/web
          npm test --prefix apps/web
          npm run build --prefix apps/web
          npm run test:bundle --prefix apps/web
          npm run test:browser --prefix apps/web
          test -x /usr/bin/google-chrome
          PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome npm run test:browser:real --prefix apps/web

  build-publish:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require tag to match the package version
        shell: bash
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - name: Build and validate sdist + wheel
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
              assert {"owcopilot/py.typed", "owcopilot/model-revisions.json"} <= names
          PY
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
