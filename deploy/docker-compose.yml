# owcopilot SaaS stack (WS-P): single API container (serves the SPA), file-backed control plane.
# Artifact — verify on a machine with Docker (`docker compose up`). Not runtime-verified in the
# dev sandbox. The canon and the control-plane (platform metadata + audit) both stay file-backed
# under the ./data volume — the control plane is SQLite, there is no separate database service.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      OWCOPILOT_JWT_SECRET: ${OWCOPILOT_JWT_SECRET:?set a long random secret}
      OWCOPILOT_API_KEY: ${OWCOPILOT_API_KEY:?set the service API key}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OWCOPILOT_WORLDS_HOME: /data/worlds
      OWCOPILOT_PLATFORM_DB: /data/platform.sqlite
    volumes:
      - ./data:/data
