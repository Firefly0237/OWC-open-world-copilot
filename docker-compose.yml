services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: owcopilot-api:latest
    ports:
      - "127.0.0.1:${OWCOPILOT_PORT:-8000}:8000"
    environment:
      OWCOPILOT_LLM_MODE: real
      OWCOPILOT_PROFILE: local
      OWCOPILOT_PROJECTS_JSON: "{}"
      OWCOPILOT_WORLDS_HOME: /app/var/worlds
      OWCOPILOT_RUNTIME_DIR: /app/var/runtime
      OWCOPILOT_CACHE_MODE: exact
      OWCOPILOT_API_KEY: "${OWCOPILOT_API_KEY:-}"
    env_file:
      - path: .env
        required: false
    volumes:
      - owcopilot-data:/app/var
    restart: unless-stopped

volumes:
  owcopilot-data:
