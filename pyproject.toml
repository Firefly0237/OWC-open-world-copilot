[build-system]
requires = ["setuptools>=77"]   # >=77 for PEP 639 SPDX `license` / `license-files`
build-backend = "setuptools.build_meta"

[project]
name = "owcopilot"
version = "0.2.0"
description = "Narrative co-creation with author-controlled agents, traceable execution, evolving workflows, and playable story state."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tingxuan Su" }]
keywords = [
    "llm", "narrative-design", "agent", "workflow",
    "human-ai-interaction", "state-machine", "copilot",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "networkx>=3.2",
    "openpyxl>=3.1",
    "python-docx>=1.1",     # planning-notes .docx export (exporters/docx_notes.py); pure Python
    "numpy>=1.26",          # exact in-SQLite vector search (retrieval/vector.py); light, ubiquitous
    "pypdf>=4.0",           # PDF manuscript import (extraction/inspiration); small, pure-Python
    # Disk-resident vector backend; falls back cleanly when unavailable.
    "sqlite-vec==0.1.9",
    # Optional on-disk ANN backend for larger corpora; exact fallback remains available.
    "usearch==2.25.3",
    # Agent-normalization round: standard orchestration + model layer (LangGraph/LangChain).
    # langchain_core also supplies the standard fake chat models used as test doubles.
    "langchain>=1.3",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
]

[project.urls]
Homepage = "https://github.com/Firefly0237/OWC-open-world-copilot"
Repository = "https://github.com/Firefly0237/OWC-open-world-copilot"
Issues = "https://github.com/Firefly0237/OWC-open-world-copilot/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx2>=2.0",          # Starlette/FastAPI testclient prefers httpx2; avoids deprecation warnings
    "ruff>=0.6",            # lint + format (replaces black/isort/flake8)
    "mypy>=1.10",           # static type checking
    # NumPy 2.5 requires Python 3.12 and ships PEP 695-only stubs.  Keep the
    # dev environment compatible with mypy's declared Python 3.11 target.
    "numpy<2.5",
    "pre-commit>=3.7",      # local commit-time gate
    "fakeredis>=2.20",      # in-memory Redis stand-in for the RedisCache tests (offline, $0)
    # Team schema/repository tests import the real PostgreSQL stack; versions mirror `postgres`.
    "SQLAlchemy>=2.0.51,<2.1",
    "alembic>=1.18.5,<2",
    "psycopg[binary]>=3.3.4,<4",
]
# Real providers via their official LangChain integrations; offline runs don't need them.
live = [
    "openai>=1.0",
    "langchain-deepseek>=1.1",
    "langchain-openai>=1.3",
    "langchain-anthropic>=1.5,<2",
]
semantic = ["sentence-transformers>=3.0"]   # real multilingual embeddings (bge-m3) for hybrid RAG; pulls torch
# HTTP stack compatibility window verified together locally. FastAPI and Starlette changed router
# and StaticFiles internals across minor lines, so widen these bounds only with the service tests.
serve = [
    "fastapi>=0.141.1,<0.142",
    "starlette>=1.4.1,<1.5",
    "uvicorn[standard]>=0.52.1,<0.53",
]
redis = ["redis>=5.0"]            # optional RedisCache backend for multi-instance stateless deploys
# The consumer relies on structuredContent/outputSchema and complete ToolAnnotations. 1.26.0 is
# the tested compatibility floor; stay below the SDK's documented v2 breaking boundary.
mcp = ["mcp>=1.26,<2"]
# Permissively licensed born-digital PDF baseline. This does not install OCR, a visual model,
# or the richer Docling candidate; the final backend choice remains gated by the PDF bake-off.
pdf = ["pypdfium2>=5.12.1,<6", "pdfplumber>=0.11.10,<0.12"]
# N1.2 shared canonical store. Team deployments install this extra explicitly.
postgres = [
    "SQLAlchemy>=2.0.51,<2.1",
    "alembic>=1.18.5,<2",
    "psycopg[binary]>=3.3.4,<4",
]
# Accurate local token accounting without Torch: cl100k_base plus the cached bge-m3 tokenizer
# used by retrieval budget trimming.  `transformers` installs the Rust `tokenizers` wheel;
# sentencepiece keeps the XLM-R fallback loadable when a fast-tokenizer artifact is unavailable.
tokenizer = [
    "tiktoken>=0.7",
    "transformers>=4.41,<5",
    "huggingface-hub>=0.34,<1",
    "sentencepiece>=0.2,<0.3",
]
# T4-B: OTEL GenAI semantic-convention span trees. Exporters optional (OTLP needs grpc extra).
observe = [
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
]
# `langsmith` is already a transitive dep of `langchain`; this extra just pins it as an explicit,
# documented optional feature — zero code here reads it. Setting LANGSMITH_TRACING=true (+
# LANGSMITH_API_KEY) makes every langchain Runnable invocation (agent, worldgen, extraction, …)
# auto-report to LangSmith; unset, tracing is a no-op and no test depends on it either way.
langsmith = ["langsmith>=0.8"]

[project.scripts]
owcopilot = "owcopilot.cli.main:main"

[tool.pytest.ini_options]
cache_dir = "var/cache/pytest"
testpaths = ["tests"]
norecursedirs = ["var", ".venv", "node_modules", "build", "dist", ".git"]

[tool.ruff]
cache-dir = "var/cache/ruff"
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["build", "dist", "_wheelcheck", ".tmp"]   # build artifacts + scratch codemods

[tool.ruff.lint]
# Pragmatic, widely-used starter set: pycodestyle errors, pyflakes, import sorting,
# pyupgrade, and bugbear. Tighten later (e.g. add D for docstrings) once stable.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # `class X(str, Enum)` -> `class X(StrEnum)` changes str()/serialization semantics; this is a
    # behaviour-preserving round, and the str-mixin form is intentional (pydantic/JSON use .value).
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately import the app under test after a runtime importorskip guard.
"tests/**/*.py" = ["E402"]

[tool.mypy]
cache_dir = "var/cache/mypy"
# Pragmatic start (per Round 5 §2.5): check our package, tolerate third-party stub gaps,
# and don't block on every untyped def. Fix real type bugs; tighten incrementally later.
files = ["src/owcopilot"]
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
owcopilot = ["py.typed", "model-revisions.json"]
